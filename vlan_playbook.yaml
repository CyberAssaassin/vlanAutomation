---
- name: Configure VLANs on Network Switches
  hosts: switches
  gather_facts: false
  vars_files:
    - vars.yaml

  tasks:
    - name: Ensure VLANs are created with correct names
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
            state: active
        state: merged
      loop: "{{ vlan_list }}"
